name: Publish (prepare)

# Phase 1 of the mcp-* publish pipeline: report the state of each release target and build
# the distribution. PyPI trusted publishing CANNOT run inside a reusable workflow (PyPI's
# Warehouse checks the OIDC job_workflow_ref, which points at this repo, not the server), so
# the actual `pypa/gh-action-pypi-publish` step stays as a top-level job in the server's own
# publish.yml stub. This phase and publish-finish.yml carry everything around it.
#
# Runs in the caller's context: github.ref_name is the tag, GITHUB_REPOSITORY is the server.
# The shared scripts live in THIS repo and are checked out into .ci/ at this workflow's own
# commit via the job.workflow_* contexts (resolve to the reusable workflow's repo/sha).
on:
  workflow_call:
    inputs:
      dry_run:
        description: "Report state only; build nothing"
        type: boolean
        default: false
    outputs:
      pypi:
        value: ${{ jobs.status.outputs.pypi }}
      release:
        value: ${{ jobs.status.outputs.release }}
      registry:
        value: ${{ jobs.status.outputs.registry }}

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  status:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      pypi: ${{ steps.all.outputs.pypi }}
      release: ${{ steps.all.outputs.release }}
      registry: ${{ steps.all.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Guard job.workflow_sha
        env:
          WF_SHA: ${{ job.workflow_sha }}
        run: '[ -n "$WF_SHA" ] || { echo "::error::job.workflow_sha is empty; cannot fetch CI scripts"; exit 1; }'
      - name: Fetch shared CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false
      - name: Tag ref and version must agree with pyproject.toml
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::run on a tag ref: gh workflow run publish.yml --ref refs/tags/vX.Y.Z"; exit 1; }
          v=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          [ "${TAG#v}" = "$v" ] || { echo "::error::tag $TAG does not match pyproject version $v"; exit 1; }
      - name: State of PyPI, GitHub release and registry
        id: all
        run: |
          { echo "| tag | state | action |"; echo "|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          .ci/scripts/ci/state.sh all "$TAG" || [ $? -eq 1 ]   # 1 = incomplete; 2 = a target is unfixable (job red), the others still run
      - name: Reconcile workflow must be enabled
        run: |
          s=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/reconcile.yml" --jq .state || echo unknown)
          [ "$s" = active ] || echo "::warning::reconcile.yml is '$s'; run: gh workflow enable reconcile.yml"

  build:
    needs: status
    if: needs.status.outputs.pypi != 'done' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"
      - run: uv build --no-create-gitignore
      - name: sdist must contain only tracked files
        run: |
          tar -tzf dist/*.tar.gz | sed 's|^[^/]*/||' | grep -v -e '/$' -e '^PKG-INFO$' | sort > /tmp/sdist.txt
          git ls-files | sort > /tmp/tracked.txt
          extra=$(comm -23 /tmp/sdist.txt /tmp/tracked.txt)
          [ -z "$extra" ] || { echo "::error::sdist contains untracked files:"; echo "$extra"; exit 1; }
      - run: sha256sum dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          overwrite: true        # a re-run of this job must not 409 on its own artifact
          retention-days: 30     # the re-run window is 30 days
