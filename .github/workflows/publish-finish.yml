name: Publish (finish)

# Phase 2 of the mcp-* publish pipeline, after the server stub's top-level `pypi` job has run
# `pypa/gh-action-pypi-publish`: confirm the files are live on PyPI, then create the immutable
# GitHub release from them and publish to the MCP registry. None of these needs PyPI's OIDC, so
# they live here. Runs in the caller's context (github.ref_name is the tag, GITHUB_REPOSITORY
# is the server); shared scripts come from .ci/ at this workflow's own commit.
on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
      fail_at:
        description: "Test hook forwarded from release.yml: fail a job on attempt 1 before it writes"
        type: string
        default: none
      pypi_state:
        description: "The pypi state from publish-prepare (done | partial | missing)"
        type: string
        default: missing

permissions: {}

env:
  TAG: ${{ github.ref_name }}
  FAIL_AT: ${{ inputs.fail_at || 'none' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  confirm-pypi:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Guard job.workflow_sha
        env:
          WF_SHA: ${{ job.workflow_sha }}
          WF_REPO: ${{ job.workflow_repository }}
        run: '[ -n "$WF_SHA" ] && [ -n "$WF_REPO" ] || { echo "::error::job.workflow_sha or job.workflow_repository is empty; cannot fetch CI scripts"; exit 1; }'
      - name: Fetch shared CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false
      - name: Confirm on PyPI
        run: .ci/scripts/ci/state.sh pypi "$TAG" --wait 120 --require "done"

  github-release:
    needs: confirm-pypi
    if: ${{ !cancelled() && !inputs.dry_run && (inputs.pypi_state == 'done' || needs.confirm-pypi.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Guard job.workflow_sha
        env:
          WF_SHA: ${{ job.workflow_sha }}
          WF_REPO: ${{ job.workflow_repository }}
        run: '[ -n "$WF_SHA" ] && [ -n "$WF_REPO" ] || { echo "::error::job.workflow_sha or job.workflow_repository is empty; cannot fetch CI scripts"; exit 1; }'
      - name: Fetch shared CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false
      - name: Release state
        id: check
        run: .ci/scripts/ci/state.sh release "$TAG"
      - name: Gate (fail_at test hook)
        run: .ci/scripts/ci/state.sh gate release "${{ steps.check.outputs.state }}"
      - name: Create immutable release from the PyPI files
        if: steps.check.outputs.state != 'done'
        run: .ci/scripts/ci/state.sh release-create "$TAG"
      - name: Confirm release
        run: .ci/scripts/ci/state.sh release "$TAG" --require "done"

  registry:
    needs: [confirm-pypi, github-release]
    if: ${{ !cancelled() && !inputs.dry_run && (inputs.pypi_state == 'done' || needs.confirm-pypi.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Guard job.workflow_sha
        env:
          WF_SHA: ${{ job.workflow_sha }}
          WF_REPO: ${{ job.workflow_repository }}
        run: '[ -n "$WF_SHA" ] && [ -n "$WF_REPO" ] || { echo "::error::job.workflow_sha or job.workflow_repository is empty; cannot fetch CI scripts"; exit 1; }'
      - name: Fetch shared CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false
      - name: Registry state
        id: check
        run: .ci/scripts/ci/state.sh registry "$TAG"
      - name: Gate (fail_at test hook)
        run: .ci/scripts/ci/state.sh gate registry "${{ steps.check.outputs.state }}"
      - name: Install mcp-publisher
        if: steps.check.outputs.state != 'done'
        env:
          # Bump both together: https://github.com/modelcontextprotocol/registry/releases
          # sha256 from registry_<ver>_checksums.txt (cosign-signed: *.sigstore.json)
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf /tmp/mcp-publisher.tar.gz -C /usr/local/bin mcp-publisher
          mcp-publisher --version
      - name: Publish to MCP Registry
        if: steps.check.outputs.state != 'done'
        run: .ci/scripts/ci/state.sh registry-publish "$TAG"
      - name: Confirm in registry
        run: .ci/scripts/ci/state.sh registry "$TAG" --wait 60 --require "done"
