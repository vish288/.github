name: Lint

# Reusable Python lint for the mcp-* servers (ruff + optional pyright) plus the PR-time
# derived-artifacts drift check, run against the caller's tree. actionlint, shellcheck and the
# scripts/ci self-tests run in THIS repo's ci.yml, where the real reusable workflows and shared
# scripts live; the server stubs are small and are linted by actionlint there only indirectly,
# so they are not re-linted here.
on:
  workflow_call:
    inputs:
      pyright:
        description: "Run `uv run pyright` after ruff (only servers that ship pyright)."
        type: boolean
        default: false
      llms_split_marker:
        description: "Heading that ends llms.txt within llms-full.txt (drift check)."
        type: string
        default: "\n## Configuration"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - if: ${{ inputs.pyright }}
        run: uv run pyright
      - name: Guard job.workflow_sha
        env:
          WF_SHA: ${{ job.workflow_sha }}
          WF_REPO: ${{ job.workflow_repository }}
        run: '[ -n "$WF_SHA" ] && [ -n "$WF_REPO" ] || { echo "::error::job.workflow_sha or job.workflow_repository is empty; cannot fetch CI scripts"; exit 1; }'
      - name: Fetch shared CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false
      - name: Derived artifacts are up to date
        env:
          LLMS_SPLIT_MARKER: ${{ inputs.llms_split_marker }}
        run: |
          python3 .ci/scripts/derive_artifacts.py
          git diff --exit-code llms.txt gemini-extension.json \
            || { echo "::error::llms.txt / gemini-extension.json are stale; the release pipeline derives them from server.json and llms-full.txt"; exit 1; }
      # Advisory only: warn when the Copier template pin (.copier-answers _commit) is behind the
      # latest vish288/.github semver tag. Copier owns the stub pins; this never fails the build.
      - name: Template drift (advisory)
        if: ${{ always() }}
        run: |
          ans=.copier-answers.yml
          if [ ! -f "$ans" ]; then
            echo "no $ans; this repo has not adopted the Copier template — skipping drift check"
            exit 0
          fi
          cur=$(sed -n -E 's/^_commit: *["'"'"']?([^"'"'"']*)["'"'"']? *$/\1/p' "$ans" | head -1)
          latest=$(git ls-remote --tags --refs https://github.com/vish288/.github 'v*' \
            | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "template pin: _commit=${cur:-?}, latest vish288/.github tag=${latest:-?}"
          if [ -n "$latest" ] && [ -n "$cur" ] && [ "$cur" != "$latest" ]; then
            echo "::warning::template drift: on $cur, latest is $latest — run scripts/fleet-update.sh $latest"
          fi
